<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time.is - 精确的时间</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <nav>
                <a href="#">菜单</a>
                <a href="#">设置</a>
            </nav>
        </header>

        <main>
            <h1 id="location">北京, 中国</h1>
            <div id="clock-container">
                <span id="time">00:00:00</span>
            </div>
            <p id="date">2026年1月10日 星期六</p>
            <p id="accuracy">您的时钟误差为：<span id="offset">-0.024 秒</span></p>
        </main>

        <footer>
            <div class="search-bar">
                <input type="text" placeholder="搜索地点...">
            </div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
