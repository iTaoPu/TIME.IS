<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time.is - 仿制版</title>
    <style>
        :root {
            --bg: #222;
            --text: #fff;
            --dim: #999;
            --accent: #333;
            --hover: #444;
        }

        body.light {
            --bg: #fff;
            --text: #222;
            --dim: #666;
            --accent: #eee;
            --hover: #ddd;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.2s;
            min-height: 100vh;
        }

        /* 顶部导航 */
        .nav {
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: flex-start;
        }

        .menu-icon { fill: var(--text); cursor: pointer; }

        /* 主时钟区域 */
        .main-clock {
            text-align: center;
            margin-top: 5vh;
            margin-bottom: 5vh;
            cursor: pointer;
        }

        #city-main { font-size: 2.2rem; font-weight: 300; color: var(--dim); }
        #time-main { 
            font-size: 15vw; 
            font-weight: 700; 
            line-height: 1; 
            letter-spacing: -4px; 
            font-variant-numeric: tabular-nums; 
        }
        #date-main { font-size: 1.6rem; color: var(--dim); margin-top: 10px; }

        /* 全球城市对比模块 - Time.is 风格 */
        .world-clock-section {
            width: 90%;
            max-width: 1000px;
            margin-bottom: 100px;
        }

        .world-clock-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2px; /* 模拟细分界线 */
            background-color: var(--accent); /* 线条颜色 */
            border: 1px solid var(--accent);
        }

        .city-item {
            background-color: var(--bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            text-decoration: none;
            color: inherit;
            transition: background 0.1s;
        }

        .city-item:hover {
            background-color: var(--hover);
        }

        .city-name {
            font-size: 1.2rem;
            font-weight: 400;
        }

        .city-time {
            font-size: 1.2rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        /* 底部同步栏 */
        .sync-bar {
            position: fixed;
            bottom: 30px;
            padding: 8px 20px;
            border-radius: 20px;
            background: var(--accent);
            font-size: 0.9rem;
            z-index: 100;
        }

        @media (max-width: 600px) {
            #time-main { font-size: 22vw; }
            .world-clock-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body class="">

    <div class="nav">
        <svg class="menu-icon" onclick="toggleMode()" width="30" height="30" viewBox="0 0 24 24">
            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
        </svg>
    </div>

    <div class="main-clock" onclick="toggleMode()">
        <div id="city-main">北京</div>
        <div id="time-main">00:00:00</div>
        <div id="date-main">加载中...</div>
    </div>

    <div class="world-clock-section">
        <div class="world-clock-grid" id="world-grid">
            </div>
    </div>

    <div id="sync-bar" class="sync-bar">正在对准原子钟...</div>

    <script>
        // 配置：替换为你部署在 Cloudflare 的 URL
        const WORKER_URL = 'https://your-worker.yourname.workers.dev';
        let offset = 0;

        // 城市配置：名称及其对应的 IANA 时区
        const cities = [
            { name: '纽约', tz: 'America/New_York' },
            { name: '伦敦', tz: 'Europe/London' },
            { name: '东京', tz: 'Asia/Tokyo' },
            { name: '巴黎', tz: 'Europe/Paris' },
            { name: '悉尼', tz: 'Australia/Sydney' },
            { name: '迪拜', tz: 'Asia/Dubai' },
            { name: '莫斯科', tz: 'Europe/Moscow' },
            { name: '洛杉矶', tz: 'America/Los_Angeles' }
        ];

        function toggleMode() {
            document.body.classList.toggle('light');
        }

        function formatTime(date, tz = null) {
            const options = {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            };
            if (tz) options.timeZone = tz;
            return new Intl.DateTimeFormat('zh-CN', options).format(date);
        }

        function updateClocks() {
            const now = new Date(Date.now() + offset);
            
            // 更新主时钟
            document.getElementById('time-main').textContent = formatTime(now);
            const dateOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date-main').textContent = now.toLocaleDateString('zh-CN', dateOptions);

            // 更新城市列表
            const grid = document.getElementById('world-grid');
            if (grid.children.length === 0) {
                // 初次渲染结构
                cities.forEach(city => {
                    const div = document.createElement('div');
                    div.className = 'city-item';
                    div.innerHTML = `
                        <span class="city-name">${city.name}</span>
                        <span class="city-time" id="time-${city.tz}">${formatTime(now, city.tz)}</span>
                    `;
                    grid.appendChild(div);
                });
            } else {
                // 后续仅更新数值
                cities.forEach(city => {
                    document.getElementById(`time-${city.tz}`).textContent = formatTime(now, city.tz);
                });
            }
            
            requestAnimationFrame(updateClocks);
        }

        async function syncTime() {
            const syncEl = document.getElementById('sync-bar');
            const t1 = Date.now();
            try {
                const res = await fetch(WORKER_URL);
                const data = await res.json();
                const t2 = Date.now();
                const latency = (t2 - t1) / 2;
                offset = (data.ms + latency) - t2;
                
                const diff = (Math.abs(offset) / 1000).toFixed(3);
                syncEl.textContent = `您的时间${offset > 0 ? '慢了' : '快了'} ${diff} 秒`;
            } catch (e) {
                syncEl.textContent = "无法同步时间";
            }
        }

        // 运行
        updateClocks();
        syncTime();
        setInterval(syncTime, 60000);
    </script>
</body>
</html>
