<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time.is - 精确的时间</title>
    <style>
        /* 样式完全仿制 Time.is */
        :root {
            --bg: #222;
            --text: #fff;
            --dim: #999;
            --accent: #555;
        }

        body.light {
            --bg: #fff;
            --text: #222;
            --dim: #666;
            --accent: #eee;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            transition: background 0.2s;
            cursor: pointer;
            user-select: none;
        }

        /* 顶部导航模拟图标 (使用 SVG 保证清晰度) */
        .menu-icon {
            position: absolute;
            top: 20px;
            left: 20px;
            fill: var(--text);
        }

        .header-info {
            font-size: 2.2rem;
            margin-bottom: 5px;
            font-weight: 300;
        }

        /* 核心大时钟 */
        #clock-container {
            text-align: center;
        }

        #time {
            font-size: 16vw;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -3px;
            font-variant-numeric: tabular-nums;
        }

        #date {
            font-size: 1.8rem;
            margin-top: 15px;
            color: var(--dim);
        }

        /* 底部同步状态栏 */
        .sync-bar {
            position: absolute;
            bottom: 50px;
            padding: 10px 25px;
            border-radius: 30px;
            background: var(--accent);
            font-size: 1rem;
            color: var(--text);
            font-weight: 500;
        }

        .syncing { animation: pulse 1s infinite; }
        @keyframes pulse { 50% { opacity: 0.6; } }

        /* 纯 CSS 图标 */
        .icon { width: 24px; height: 24px; vertical-align: middle; margin-right: 8px; }
    </style>
</head>
<body onclick="toggleMode()">

    <svg class="menu-icon" width="30" height="30" viewBox="0 0 24 24">
        <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
    </svg>

    <div id="clock-container">
        <div class="header-info" id="city">北京, 中国</div>
        <div id="time">00:00:00</div>
        <div id="date">正在读取...</div>
    </div>

    <div id="sync-bar" class="sync-bar syncing">正在连接原子钟...</div>

    <script>
        // 配置：请将此地址替换为你部署的 Cloudflare Worker URL
        const WORKER_URL = 'https://time-api.sspai.pp.ua';
        
        let offset = 0; // 本地与服务器的时间差

        // 1. 高精度时间显示逻辑
        function updateDisplay() {
            const now = new Date(Date.now() + offset);
            
            const h = now.getHours().toString().padStart(2, '0');
            const m = now.getMinutes().toString().padStart(2, '0');
            const s = now.getSeconds().toString().padStart(2, '0');
            
            document.getElementById('time').textContent = `${h}:${m}:${s}`;
            
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('zh-CN', options);
            
            requestAnimationFrame(updateDisplay);
        }

        // 2. 时间同步逻辑 (NTP 原理)
        async function syncTime() {
            const syncEl = document.getElementById('sync-bar');
            const t1 = Date.now();
            
            try {
                const response = await fetch(WORKER_URL);
                const data = await response.json();
                const t2 = Date.now();
                
                // 计算延迟和实际偏移
                const latency = (t2 - t1) / 2;
                const serverTime = data.ms + latency;
                offset = serverTime - t2;

                const diffSeconds = (Math.abs(offset) / 1000).toFixed(3);
                const status = offset > 0 ? "慢了" : "快了";
                
                syncEl.classList.remove('syncing');
                syncEl.textContent = `您的时钟${status} ${diffSeconds} 秒 (误差 ±${latency.toFixed(0)}ms)`;
                syncEl.style.background = "#28a745"; // 绿色表示同步成功
                
                setTimeout(() => {
                    syncEl.style.background = "var(--accent)";
                }, 3000);

            } catch (err) {
                syncEl.textContent = "同步失败，正在重试...";
                syncEl.style.background = "#dc3545";
            }
        }

        // 3. 交互：点击切换模式
        function toggleMode() {
            document.body.classList.toggle('light');
        }

        // 初始化
        updateDisplay();
        syncTime();
        setInterval(syncTime, 30000); // 每30秒自动后台对时
    </script>
</body>
</html>
